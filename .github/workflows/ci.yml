name: Trace CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Run a controlled Trace RCA demonstration failure after tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ci:
    name: Trace CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Controlled Trace RCA demonstration failure
        if: ${{ inputs.force_failure == true }}
        run: |
          echo "Trace RCA demonstration: controlled CI failure after lint and tests." >&2
          echo "This failure is intentional and reproducible for incident-analysis testing." >&2
          exit 1

      - name: Build application
        run: npm run build
