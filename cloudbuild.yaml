steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/trace", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/trace"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "trace"
      - "--image"
      - "gcr.io/$PROJECT_ID/trace"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--update-labels"
      - "dev-tutorial=cloud-run-ai-challenge"
      - "--set-env-vars"
      - "NODE_ENV=production,DEMO_MODE=false"
      - "--set-secrets"
      - "GEMINI_API_KEY=GEMINI_API_KEY:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,GITHUB_CLIENT_ID=GITHUB_CLIENT_ID:latest,GITHUB_CLIENT_SECRET=GITHUB_CLIENT_SECRET:latest,GITHUB_OAUTH_STATE_SECRET=GITHUB_OAUTH_STATE_SECRET:latest,GITHUB_TOKEN_ENCRYPTION_KEY=GITHUB_TOKEN_ENCRYPTION_KEY:latest,GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest"
